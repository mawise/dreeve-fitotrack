services:
  fitotrack-relay:
    image: python:3.12-alpine
    container_name: fitotrack-relay
    restart: unless-stopped
    volumes:
      - ./fitotrack_relay.py:/app/fitotrack_relay.py:ro
    environment:
      - DREEVE_UPLOAD_URL=${DREEVE_UPLOAD_URL:-http://app:8080/api/v1/activity/upload}
    command: ["python3", "/app/fitotrack_relay.py"]
    ports:
      - "127.0.0.1:8081:8081"
